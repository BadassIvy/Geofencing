services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: geofence_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geofence_db?sslmode=disable
      PORT: 8080
    depends_on:
      - postgres

volumes:
  postgres_data: